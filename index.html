<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F5">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="刷题本">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>刷题本</title>
<style>
:root{
  --bg:#F2F3F5; --panel:#FFFFFF; --ink:#1B1F27; --ink2:#5F6673; --ink3:#9AA1AC; --line:#E4E6EB; --line2:#D2D5DC;
  --accent:#2B5BD7; --accent-bg:#EAF0FE;
  --ok:#1E8E5A; --ok-bg:#E6F5EC; --bad:#D63B3B; --bad-bg:#FCEAEA; --warn:#B7791F; --warn-bg:#FBF1DC;
  --r:14px; --shadow:0 1px 2px rgba(20,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121417; --panel:#1C1F25; --ink:#ECEEF2; --ink2:#A8AFBB; --ink3:#6E7683; --line:#2C3038; --line2:#3A3F4A;
    --accent:#6C8EF5; --accent-bg:#1F2A45; --ok:#4CC38A; --ok-bg:#16301F; --bad:#F26D6D; --bad-bg:#3A1C1C; --warn:#E0A94A; --warn-bg:#352A14; --shadow:none; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;min-height:52px;padding:env(safe-area-inset-top) 6px 0;background:var(--bg)}
.notice{margin:12px 16px 0;padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.top .ttl{flex:1;text-align:center;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.iconbtn:active{background:var(--line)}
.iconbtn.placeholder{visibility:hidden}
.pad{padding:8px 16px 16px}
h1{font-size:26px;margin:14px 0 4px;font-weight:700;letter-spacing:.01em}
h2{font-size:20px;margin:0 0 6px;font-weight:700}
.muted{color:var(--ink2)}
.small{font-size:13px}
.panel{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.sub{margin-top:12px;padding:16px 16px 14px;border-left:5px solid var(--c)}
.sub .name{font-size:20px;font-weight:700;color:var(--c);display:flex;align-items:center;gap:8px}
.sub .name .n{font-size:13px;font-weight:500;color:var(--ink2)}
.sub .stat{margin:4px 0 12px;color:var(--ink2);font-size:14px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line2);background:var(--panel);font-weight:600;font-size:15px;line-height:1.25;text-align:center;transition:transform .08s,background .12s,opacity .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.tint{background:var(--accent-bg);border-color:transparent;color:var(--accent)}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn .cnt{font-weight:500;font-size:13px;opacity:.85}
.btn.col{flex-direction:column;gap:1px;padding:7px 6px;min-height:54px}
.btn.col .cnt{font-size:12px;line-height:1.2}
.link{background:none;border:0;padding:8px 0;color:var(--ink2);font-size:14px;display:flex;align-items:center;gap:4px}
.link.acc{color:var(--accent);font-weight:600}
.pbar{height:4px;background:var(--line);margin:0 16px;border-radius:2px;overflow:hidden}
.pfill{height:100%;background:var(--accent);border-radius:2px;transition:width .25s}
.qcard{margin:14px 16px 0;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 16px 12px}
.qcard.anim{animation:qin .18s ease-out}
@keyframes qin{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.qcard.anim{animation:none}.btn:active{transform:none}}
.qmeta{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:13px;margin-bottom:10px;flex-wrap:wrap}
.qmeta .qnum{font-weight:700;color:var(--ink);font-size:15px}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--accent-bg);color:var(--accent)}
.badge.multi{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.gray{background:var(--line);color:var(--ink2)}
.stem{font-size:17px;line-height:1.65;margin-bottom:14px;overflow-wrap:anywhere;white-space:pre-line}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 12px;margin-bottom:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);font-size:16px;line-height:1.5;transition:background .12s,border-color .12s,transform .08s;user-select:none;-webkit-user-select:none}
.opt:active{transform:scale(.985)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;margin-top:1px}
.opt .t{flex:1;overflow-wrap:anywhere;white-space:pre-line}
.opt.sel{border-color:var(--accent);background:var(--accent-bg)}
.opt.sel .l{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.miss{border-color:var(--ok);border-style:dashed;background:var(--ok-bg)}
.opt.miss .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.done{pointer-events:none}
.verdict{margin:4px 0 6px;padding:10px 12px;border-radius:10px;font-weight:600;font-size:15px}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.exp{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--bg);color:var(--ink2);font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);padding:10px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;max-width:640px;margin:0 auto}
.bottombar .btn{flex:1;min-height:50px;font-size:16px}
.bottombar .btn.prev{flex:0 0 96px}
.summary{margin:24px 16px;text-align:center}
.summary .big{font-size:40px;font-weight:700;margin:8px 0 0}
.summary p{color:var(--ink2);margin:6px 0}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.list{margin:0 16px}
.item{display:flex;gap:10px;align-items:flex-start;padding:12px 12px;background:var(--panel);border-radius:12px;margin-bottom:8px;border:1.5px solid transparent}
.item.selected{border-color:var(--accent);background:var(--accent-bg)}
.item .no{flex:none;width:34px;color:var(--ink3);font-size:13px;font-weight:600;padding-top:2px}
.item .body{flex:1;min-width:0}
.item .st{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;line-height:1.45}
.item .tags{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.item .chk{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line2);margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.item.selected .chk{background:var(--accent);border-color:var(--accent)}
.item .act{flex:none}
.search{width:100%;min-height:42px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--panel);font-size:16px;outline:none}
.search:focus{border-color:var(--accent)}
textarea.ta{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);font-size:16px;line-height:1.5;resize:vertical;outline:none}
textarea.ta:focus{border-color:var(--accent)}
input.inp{width:100%;min-height:42px;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--panel);font-size:16px;outline:none}
input.inp:focus{border-color:var(--accent)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px;font-weight:600}
.optrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.optrow .l{flex:none;width:28px;font-weight:700;color:var(--ink2);text-align:center}
.optrow .x{flex:none;width:36px;height:36px;border:0;background:transparent;color:var(--ink3);font-size:20px;border-radius:8px}
.letters{display:flex;gap:8px;flex-wrap:wrap}
.letters button{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line2);background:var(--panel);font-weight:700;font-size:16px}
.letters button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:flex;border:1.5px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;min-height:38px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--accent);color:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle .lbl{font-weight:600}
.toggle .desc{font-size:13px;color:var(--ink2);margin-top:2px}
.sw{flex:none;width:50px;height:30px;border-radius:15px;background:var(--line2);border:0;position:relative;transition:background .15s;margin-left:12px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--ok)}
.sw.on::after{left:23px}
.empty{text-align:center;color:var(--ink2);padding:40px 20px;font-size:15px}
.ovstats{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ovstats .badge{font-size:13px;padding:3px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-top:12px}
.cell{height:44px;border-radius:10px;border:1.5px solid var(--line2);background:var(--panel);font-weight:600;font-size:14px;color:var(--ink2);padding:0}
.cell.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.cell.cur{box-shadow:0 0 0 2.5px var(--accent);border-color:var(--accent);color:var(--accent)}
.cell.cur.ok,.cell.cur.bad{color:inherit}
.sect{margin:22px 0 8px;font-size:13px;color:var(--ink2);font-weight:600}
.danger-zone .btn{width:100%;margin-bottom:8px;justify-content:flex-start}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:rgba(28,31,39,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50;max-width:88%;text-align:center}
@media (prefers-color-scheme: dark){#toast{background:rgba(236,238,242,.95);color:#121417}}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.mask{align-items:center}}
.dlg{width:100%;max-width:520px;background:var(--panel);border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@media (min-width:640px){.dlg{border-radius:18px;padding-bottom:16px}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.dlg h3{margin:0 0 8px;font-size:18px}
.dlg .body{color:var(--ink2);font-size:15px;margin-bottom:14px;white-space:pre-line}
.dlg .acts{display:flex;flex-direction:column;gap:8px}
.dlg .acts .btn{width:100%}
.hint{font-size:13px;color:var(--ink2);line-height:1.6}
details{margin-top:8px}
summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:600}
code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);padding:1px 5px;border-radius:5px;font-size:13px}
.kbd{display:none;color:var(--ink3);font-size:12px;text-align:center;margin-top:6px}
@media (hover:hover) and (min-width:700px){.kbd{display:block}}
.prev-info{margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:14px}
.prev-info .st{font-weight:600;margin-bottom:4px}
.prev-info .o{color:var(--ink2);font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal-root"></div>
<script id="seed-data">
/* ============================================================
   题目数据（在这里填题，也可以不改这里、直接在网页里导入）
   ------------------------------------------------------------
   law = 法律   biz = 业务   pol = 政治

   每道题一行，格式：
   { stem: "题干", opts: ["选项A", "选项B", "选项C", "选项D"], ans: "AB", exp: "解析，可不写" },

   · ans 填正确选项的字母：一个字母是单选，两个以上是多选（自动判断）
   · 判断题：opts 写 ["对", "错"]，ans 写 "A" 或 "B"
   · 选项可以是 2～8 个；每题末尾的逗号别漏，题干里有英文引号要写成 \"
   · 打开网页时，这里新增的题会自动进入对应科目的题库，已有的不会重复
   · 改题目、删题目请在网页的"题库管理"里操作（这里改了旧题不会跟着变）
   ============================================================ */
var SEED_QUESTIONS = {

  law: [
    // 法律题写在这里，格式同下面的政治题，例如：
    // { stem: "题干（ ）。", opts: ["选项A", "选项B", "选项C", "选项D"], ans: "AB", exp: "解析" },
  ],

  biz: [
    // 业务题写在这里
  ],

  pol: [
    { stem: "经批准发布的各部门各单位 \"三定\" 规定、机构编织管理规定等，是机构编制法定化的重要形式，具有（）。", opts: ["权威性", "严肃性", "灵活性", "可行性"], ans: "AB" },
    { stem: "参加各类社会化教育培训，按照（ ）原则，所需学习费用由干部本人承担。", opts: ["业余学习 单位报销", "脱产学习 费用自理", "业余学习 费用自理", "脱产学习 单位报销"], ans: "C" },
    { stem: "机构编制违规违纪违法行为的问责时限是？（ ）", opts: ["3 个月", "6 个月", "1 年", "终身"], ans: "D" },
    { stem: "编制和领导职数配备应当符合什么规定？（ ）", opts: ["编制配备符合编制种类、结构和总额等规定", "编制配备符合编制种类、单位职能、编制总额等规定", "领导职数配备应当符合领导职务名称、层级、数量、编制等规定", "领导职数配备应当符合领导职务名称、层级、数量等规定，领导职务名称应当与机构层级相符合"], ans: "AD" },
    { stem: "任何组织和个人对违反机构编制管理规定的行为，有权向（ ）等有关部门举报。", opts: ["机关党委", "纪检监察机关", "组织部门", "机构编制委员会办公室"], ans: "BCD" },
    { stem: "违反《中国共产党机构编制工作条例》规定，以及机构编制违纪违法行为查处和追责不力、问题整改不到位造成严重后果的，依照（ ）等规定追究责任。", opts: ["《中国共产党纪律处分条例》", "《公务员法》", "《干部双重管理工作规定》", "《中国共产党问责条例》"], ans: "AD" },
    { stem: "地方机构设置和职能配置应当保证有效实施党中央方针政策和国家法律法规，涉及党中央集中统一领导和国家（ ）的机构职能应当同中央基本对应。", opts: ["政策统一", "政令统一", "市场统一", "法制统一"], ans: "BCD" },
    { stem: "贯彻编制就是法制的要求，机构编制一经确定必须严格执行，（ ）等应当以机构编制为基本依据。", opts: ["核拨人员经费", "配备干部", "评优评先", "录（聘）用人员"], ans: "ABD" },
    { stem: "对机构编制违规违纪违法行为，根据事实、性质、情节和危害程度，机构编制委员会办公室可以采取以下处理措施。（ ）", opts: ["通报批评", "责令限期纠正", "予以纠正", "下达告诫书"], ans: "ABC" },
    { stem: "国家移民管理机构的内务设置应当有利于（），因地制宜、整齐划一，符合卫生和安全要求。", opts: ["工作", "办案", "学习", "生活"], ans: "ACD" },
    { stem: "录用公务员，坚持公开、平等、竞争、择优的原则，按照德才兼备的标准，采取（ ）相结合的方法进行。", opts: ["考试", "面试", "考察", "体检"], ans: "AC" },
    { stem: "下列人员不得报考公务员（ ）。", opts: ["曾因犯罪受过刑事处罚的", "曾被开除公职的", "曾受一般处分的", "有法律规定不得录用为公务员的其他情形的"], ans: "ABD" },
    { stem: "干部教育培训是对党的干部进行教育培训的实践活动，是建设堪当民族复兴重任的高素质干部队伍的（ ）工程。", opts: ["先导性", "基础性", "战略性", "社会性"], ans: "ABC" },
    { stem: "开展习近平新时代中国特色社会主义思想教育培训，教育引导干部深刻理解这一重要思想的（ ）。", opts: ["核心要义", "丰富内涵", "实践要求", "中心思想"], ans: "ABC" },
    { stem: "干部教育培训工作的重点是（ ）。", opts: ["党的理论教育", "树立职业理想", "党性教育", "履职能力培训"], ans: "ACD" },

  function curRound(){ var sub = subById(view.sid); return sub ? { sub: sub, r: sub.rounds[view.mode] } : null; }

    var c = currentQ(); if (!c) return;

  function judge(chosen){
    var c = currentQ(); if (!c) return;
    var sub = c.sub, r = c.r, q = c.q;
    chosen = chosen.split('').sort().join('');
    var ok = chosen === q.ans;
    r.answers[q.id] = { c: chosen, ok: ok };
    r.done++; if (!ok) r.wrong++;
    var st = sub.stats[q.id] || (sub.stats[q.id] = { d: 0, w: 0 });
    st.d++; if (!ok) st.w++; st.last = ok ? 1 : 0;
    if (view.mode === 'wrong') { if (ok) { removeWrong(sub, q.id); r.removed++; } else addWrong(sub, q.id); }
    else if (!ok) addWrong(sub, q.id);

      var tok = ++P.token, qid = q.id;

    }

  function edSave(){

    var stem = ED.stem.trim();
    var opts = ED.opts.map(function(o){ return o.trim(); });
    while (opts.length && !opts[opts.length - 1]) opts.pop();
    if (opts.some(function(o){ return !o; })) { toast('中间有空的选项，请填写或删除'); return; }
    var ans = ED.ans.split('').filter(function(L){ return LET.indexOf(L) < opts.length; }).sort().join('');
    if (!stem) { toast('请填写题干'); return; }
    if (opts.length < 2) { toast('至少需要两个选项'); return; }
    if (!ans) { toast('请点选正确答案'); return; }
    var multi = ans.length > 1 || ED.multi;
    if (ED.qid != null) {
      var q = qById(sub, ED.qid); if (!q) return;
      q.stem = stem; q.opts = opts; q.ans = ans; q.multi = multi; q.exp = ED.exp.trim(); refreshFlags(q);
      save(); toast('已保存'); ED = null; back();
    } else {
      addQuestions(sub, [{ stem: stem, opts: opts, ans: ans, multi: multi, exp: ED.exp.trim(), flags: [] }], false);
      save(); toast('已添加到题库末尾'); ED = null; back();

      var st = IMP.stats, dup = IMP.dup;
      h += '<div class="panel" style="margin-top:16px">';
      if (!IMP.qs.length) h += '<div class="muted">没有识别出题目。请检查每道题是否有 A/B/C/D 选项，答案是否用"答案：AB"这样标注。</div>';
      else {
        h += '<div style="font-weight:600;font-size:17px">识别到 ' + IMP.qs.length + ' 道题</div>';
        h += '<div class="muted small" style="margin-top:4px">单选 ' + st.single + ' · 多选 ' + st.multi + (st.bad ? ' · <span style="color:var(--warn)">需修正 ' + st.bad + '</span>' : '') + (dup ? ' · 与题库重复 ' + dup + ' 题' : '') + '</div>';
        IMP.qs.slice(0, 2).forEach(function(q){ h += '<div class="prev-info"><div class="st">' + esc(q.stem.slice(0, 80)) + (q.stem.length > 80 ? '…' : '') + '</div><div class="o">' + q.opts.map(function(o, i){ return LET[i] + ' ' + o; }).join('　').slice(0, 120) + '</div><div class="o">答案：' + (q.ans || '未识别') + (q.multi ? '（多选）' : '') + '</div></div>'; });
        if (IMP.qs.length > 2) h += '<div class="muted small" style="margin-top:8px">…还有 ' + (IMP.qs.length - 2) + ' 题</div>';
        if (st.bad) h += '<div class="hint" style="margin-top:8px">需修正的题会一起导入，但不会出现在刷题里；在题库管理里筛选"待修正"补全即可。</div>';
        h += '<div class="toggle" style="margin-top:6px"><div><div class="lbl">跳过重复的题</div><div class="desc">题干和选项完全相同的不再导入</div></div><button class="sw ' + (IMP.skipDup ? 'on' : '') + '" data-act="impskipdup" aria-label="跳过重复"></button></div>';
        var willAdd = IMP.skipDup ? IMP.qs.length - dup : IMP.qs.length;
        h += '<div class="stack"><button class="btn primary" data-act="impconfirm"' + (willAdd ? '' : ' disabled') + '>导入 ' + willAdd + ' 题到 ' + esc(sub.name) + '</button></div>';
      }
      h += '</div>';
    }
    h += '<details><summary>支持什么格式？</summary><div class="hint" style="margin-top:6px">每道题：题干在前，选项 A、B、C、D…各占一行或写在同一行都可以，答案用"答案：AB"标注（写在题干末尾或选项后面都行）。题号可有可无。多选题会按答案字母数自动判断，也识别"（多选）"标记和"二、多选题"这类小标题。有"解析："的会一起收入，做完题后显示。</div></details>';
    h += '</div>';
    return h;
  }
  function importParsed(qs, stats, text){
    var sub = subById(view.sid); if (!sub) return;
    var keys = {}; sub.questions.forEach(function(q){ keys[qKey(q)] = 1; });
    var dup = 0, seen = {};
    qs.forEach(function(q){ var k = qKey(q); if (keys[k] || seen[k]) dup++; seen[k] = 1; });
    IMP = { qs: qs, stats: stats, dup: dup, skipDup: true, text: text || '' };
    render();
    if (!qs.length) toast('没有识别出题目');
  }
  function impFromFile(file){
    var name = (file.name || '').toLowerCase();
    var reader = new FileReader();
    reader.onerror = function(){ toast('读取文件失败'); };
    reader.onload = function(){
      var buf = reader.result;
      if (/\.docx$/.test(name)) {
        Core.docxToLines(buf).then(function(lines){
          var res = Core.parseQuestions(lines.join('\n'));
          importParsed(res.questions, res.stats, '');
        }).catch(function(err){
          var msg = err && err.message;
          if (msg === 'NODS') toast('这个浏览器不能直接读 Word，请复制文字粘贴导入');
          else if (msg === 'NOTZIP' || msg === 'NODOC') toast('不是有效的 .docx 文件（老版 .doc 请另存为 .docx）');
          else toast('读取 Word 失败，请复制文字粘贴导入');
        });
      } else {
        var text;
        try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
        catch (e) { try { text = new TextDecoder('gbk').decode(buf); } catch (e2) { text = new TextDecoder('utf-8').decode(buf); } }
        var res = Core.parseQuestions(text);
        importParsed(res.questions, res.stats, '');
      }
    };
    reader.readAsArrayBuffer(file);
  }
  function impConfirm(){
    var sub = subById(view.sid); if (!sub || !IMP || !IMP.qs.length) return;
    var res = addQuestions(sub, IMP.qs, IMP.skipDup);
    save();
    IMP = null;
    toast('已导入 ' + res.added + ' 题' + (res.skipped ? '，跳过重复 ' + res.skipped + ' 题' : ''));
    back();
  }

  // ---------- settings ----------
  function renderSettings(){
    var h = topbar('设置与备份');
    h += '<div class="pad">';
    h += '<div class="panel">';
    h += toggleRow('autoNext', '答对自动下一题', '答对后停一下自动翻页，答错则停留查看答案');
    h += toggleRow('shuffleOpts', '选项乱序', '打乱每道题选项的位置，防止靠位置记答案');
    h += toggleRow('wrongShuffle', '错题本乱序', '做错题时打乱顺序');
    h += '</div>';
    h += '<div class="sect">备份</div><div class="panel"><div class="stack" style="margin-top:0">';
    h += '<button class="btn primary" data-act="export">导出全部数据（题目 + 进度 + 错题本）</button>';
    h += '<input type="file" id="bk-file" accept=".json" style="display:none"><button class="btn" data-act="restore">从备份文件恢复</button>';
    h += '<button class="btn" data-act="reseed">重新载入文件里内置的题目</button>';
    h += '</div><p class="hint" style="margin:10px 0 0">导出的文件可以传到另一台设备恢复，手机和电脑之间就是这样同步的。清理浏览器数据会清掉这里的所有内容，记得定期导出。<br>文件里 SEED_QUESTIONS 处填写的题目，打开网页时会自动进入题库（已有的不重复）；如果删过其中的题，想找回可以点"重新载入"。</p></div>';
    h += '<div class="sect">危险操作</div><div class="panel danger-zone"><button class="btn danger" data-act="wipe">清空全部数据</button></div>';
    h += '<p class="hint" style="margin-top:20px">刷题本 · 单文件离线版。所有数据只保存在本设备浏览器中。</p>';
    h += '</div>';
    return h;
  }
  function toggleRow(key, label, desc){
    return '<div class="toggle"><div><div class="lbl">' + label + '</div><div class="desc">' + desc + '</div></div><button class="sw ' + (S.settings[key] ? 'on' : '') + '" data-act="toggle" data-k="' + key + '" aria-label="' + label + '"></button></div>';
  }
  function exportData(){
    var data = JSON.stringify(S);
    var blob = new Blob([data], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = '刷题本备份_' + fmtDate() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    toast('已导出备份文件');
  }
  function restoreFrom(file){
    var reader = new FileReader();
    reader.onload = function(){
      var s;
      try { s = JSON.parse(reader.result); } catch(e){ toast('不是有效的备份文件'); return; }
      if (!s || !s.subjects) { toast('不是有效的备份文件'); return; }
      confirmDlg('恢复备份？', '当前设备上的数据会被备份文件替换。', '恢复', true, function(){
        S = s; if (!S.settings) S.settings = {}; if (!S.appliedSeeds) S.appliedSeeds = [];
        S.subjects.forEach(function(sub){ if (!sub.rounds) sub.rounds = {}; if (!sub.stats) sub.stats = {}; if (!sub.wrong) sub.wrong = []; });
        save(); toast('已恢复'); stack = []; replaceView({ name:'home' });
      });
    };
    reader.readAsText(file, 'utf-8');
  }

  // ---------- actions ----------
  var actions = {
    back: function(){ back(); },
    settings: function(){ go({ name:'settings' }); },
    practice: function(el){ var sub = subById(el.getAttribute('data-sid')); if (!sub) return; var mode = el.getAttribute('data-mode');
      if (mode === 'wrong' && !sub.wrong.length) { toast('错题本是空的'); return; }
      if (mode !== 'wrong' && !sub.questions.filter(validQ).length) { toast('还没有可以做的题'); return; }
      ensureRound(sub, mode); go({ name:'practice', sid: sub.id, mode: mode }); },
    wrongbook: function(el){ go({ name:'wrongbook', sid: el.getAttribute('data-sid') }); },
    overview: function(el){ var sub = subById(el.getAttribute('data-sid')); if (!sub) return; var mode = el.getAttribute('data-mode') || 'seq';
      if (mode === 'wrong' ? !sub.wrong.length && !sub.rounds.wrong : !sub.questions.filter(validQ).length) { toast('还没有题目'); return; }
      go({ name:'overview', sid: sub.id, mode: mode }); },
    jumpto: function(el){ var sub = subById(view.sid); if (!sub) return; var r = sub.rounds[view.mode]; if (!r) return;
      var i = parseInt(el.getAttribute('data-i'), 10); if (!(i >= 0 && i < r.order.length)) return;
      r.pos = i; r.finished = false; save(); P = null;
      if (stack.length && stack[stack.length - 1].name === 'practice') back(); else replaceView({ name:'practice', sid: sub.id, mode: view.mode }); },
    manage: function(el){ MG = { sel: null, q: '', filter: 'all' }; go({ name:'manage', sid: el.getAttribute('data-sid') }); },
    import: function(el){ IMP = null; go({ name:'import', sid: el.getAttribute('data-sid') }); },
    addsubject: function(){ promptDlg('新科目名称', '例如：法律', '', function(v){ v = (v || '').trim(); if (!v) return; var id = 's' + Date.now().toString(36); S.subjects.push(newSubject(id, v, pickColor())); save(); render(); }); },
    pick: function(el){ pick(el.getAttribute('data-l')); },
    confirm: function(){ var sel = Object.keys(P.sel); if (sel.length) judge(sel.join('')); },
    next: function(){ next(); },
    prev: function(){ prev(); },
    pmenu: function(){ practiceMenu(); },
    restart: function(){ var sub = subById(view.sid); if (!sub) return; startRound(sub, view.mode); P = null; render(); window.scrollTo(0, 0); },
    gowrong: function(){ var sub = subById(view.sid); if (!sub || !sub.wrong.length) return; ensureRound(sub, 'wrong'); replaceView({ name:'practice', sid: sub.id, mode: 'wrong' }); },
    wrongorder: function(el){ S.settings.wrongShuffle = el.getAttribute('data-v') === '1'; save(); render(); },
    rmwrong: function(el, e){ e.stopPropagation(); var sub = subById(view.sid); var id = parseInt(el.getAttribute('data-qid'), 10); removeWrong(sub, id); save(); toast('已移出错题本'); render(); },
    clearwrong: function(){ var sub = subById(view.sid); confirmDlg('清空错题本？', '错题本里的 ' + sub.wrong.length + ' 题会全部移出。', '清空', true, function(){ sub.wrong = []; delete sub.rounds.wrong; save(); toast('错题本已清空'); render(); }); },
    submenu: function(){ subjectMenu(); },
    addq: function(){ ED = null; go({ name:'edit', sid: view.sid, qid: null }); },
    editq: function(el){ ED = null; go({ name:'edit', sid: view.sid, qid: parseInt(el.getAttribute('data-qid'), 10) }); },
    selmode: function(){ MG.sel = {}; render(); },
    selcancel: function(){ MG.sel = null; render(); },
    seltoggle: function(el){ var id = parseInt(el.getAttribute('data-qid'), 10); if (MG.sel[id]) delete MG.sel[id]; else MG.sel[id] = 1; render(); },
    selall: function(){ var sub = subById(view.sid); filteredList(sub).forEach(function(q){ MG.sel[q.id] = 1; }); render(); },
    seldelete: function(){ var sub = subById(view.sid); var ids = Object.keys(MG.sel).map(Number); if (!ids.length) return;
      confirmDlg('删除所选的 ' + ids.length + ' 题？', '删除后不可恢复。', '删除', true, function(){ deleteQuestions(sub, ids); save(); MG.sel = null; toast('已删除 ' + ids.length + ' 题'); render(); }); },
    mgfilter: function(el){ MG.filter = el.getAttribute('data-v'); render(); },
    edrmopt: function(el){ edReadForm(); var i = parseInt(el.getAttribute('data-i'), 10); ED.opts.splice(i, 1); ED.ans = ''; render(); },
    edaddopt: function(){ edReadForm(); ED.opts.push(''); render(); },
    edletter: function(el){ edReadForm(); var L = el.getAttribute('data-l'); var s = ED.ans.split('');
      if (s.indexOf(L) >= 0) s = s.filter(function(x){ return x !== L; }); else s.push(L);
      ED.ans = s.sort().join(''); if (ED.ans.length > 1) ED.multi = true; render(); },
    edtype: function(el){ edReadForm(); ED.multi = el.getAttribute('data-v') === '1'; render(); },
    edsave: function(){ edSave(); },
    eddelete: function(){ var sub = subById(view.sid); confirmDlg('删除这道题？', '删除后不可恢复。', '删除', true, function(){ deleteQuestions(sub, [ED.qid]); save(); toast('已删除'); ED = null; back(); }); },
    impfile: function(){ var f = document.getElementById('imp-file'); if (f) { f.value = ''; f.click(); } },
    impparse: function(){ var t = document.getElementById('imp-text'); var text = t ? t.value : ''; if (!text.trim()) { toast('先粘贴题目文字'); return; } var res = Core.parseQuestions(text); importParsed(res.questions, res.stats, text); },
    impskipdup: function(){ IMP.skipDup = !IMP.skipDup; render(); },
    impconfirm: function(){ impConfirm(); },
    toggle: function(el){ var k = el.getAttribute('data-k'); S.settings[k] = !S.settings[k]; save(); render(); },
    export: function(){ exportData(); },
    restore: function(){ var f = document.getElementById('bk-file'); if (f) { f.value = ''; f.click(); } },
    reseed: function(){ var n = applySeeds(true); toast(seedError ? '题目数据有语法错误，未能载入' : (n ? '已载入 ' + n + ' 题' : '文件里的题目都已在题库中')); render(); },
    wipe: function(){ confirmDlg('清空全部数据？', '所有科目、题目、进度和错题本都会删除。建议先导出备份。', '全部清空', true, function(){ S = defaultState(); ensureDefaults(); save(); toast('已清空'); stack = []; replaceView({ name:'home' }); }); }
  };
  app.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    var fn = actions[el.getAttribute('data-act')]; if (fn) fn(el, e);
  });
  app.addEventListener('change', function(e){
    if (e.target.id === 'imp-file' && e.target.files && e.target.files[0]) impFromFile(e.target.files[0]);
    if (e.target.id === 'bk-file' && e.target.files && e.target.files[0]) restoreFrom(e.target.files[0]);
  });
  app.addEventListener('input', function(e){
    if (e.target.id === 'mg-search') { MG.q = e.target.value; var list = document.getElementById('mg-list'); var sub = subById(view.sid); if (list && sub) list.innerHTML = manageListHtml(sub); }
  });
  document.addEventListener('keydown', function(e){
    if (modalOpen) {
      if (e.key === 'Enter' && e.target && e.target.id === 'dlg-input') { var fn0 = modalActions.b0, v0 = e.target.value; closeModal(); if (fn0) fn0(v0); }
      else if (e.key === 'Escape') closeModal();
      return;
    }
    if (view.name !== 'practice' || e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea') return;
    var c = currentQ(); if (!c) { if (e.key === 'Enter') { var b = app.querySelector('[data-act="restart"]'); if (b) b.click(); } return; }
    var a = c.r.answers[c.q.id];
    if (/^[a-hA-H]$/.test(e.key)) {
      var perm = optPerm(c.q, c.r); var di = LET.indexOf(e.key.toUpperCase());
      if (di < perm.length && !a) pick(LET[perm[di]]);
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (a) next(); else if (c.q.multi && Object.keys(P.sel).length) judge(Object.keys(P.sel).join(''));
    } else if (e.key === 'ArrowLeft') prev();
    else if (e.key === 'ArrowRight' && a) next();
  });

  // ---------- boot ----------
  S = loadState();
  ensureDefaults();
  migrate();
  applySeeds();
  render();
  if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator && location.protocol === 'https:') {
    try { navigator.serviceWorker.register('./sw.js').catch(function(){}); } catch(e){}
  }

  if (window.__TEST__) window.__app = { actions: actions, render: render, getState: function(){ return S; }, getView: function(){ return view; }, setView: function(v){ view = v; P = null; render(); }, judge: judge, pick: pick, next: next, prev: prev, getP: function(){ return P; }, getIMP: function(){ return IMP; }, setIMP: function(v){ IMP = v; }, deleteQuestions: deleteQuestions, startRound: startRound, subById: subById, MG: function(){ return MG; }, getED: function(){ return ED; }, closeModal: closeModal, modalActions: function(){ return modalActions; } };
})();
</script>
</body>
</html>
